<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Russian - Verbs</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <span class="app-title">learn russian</span>
      <nav class="app-nav">
        <button id="nav-verbs" class="nav-link active">verbs</button>
        <button id="nav-numbers" class="nav-link">numbers</button>
      </nav>
    </header>

    <main class="app-main">
      <!-- Verbs Page -->
      <section id="page-verbs" class="page-section active">
        <div class="mode-selector">
          <button id="btn-mode-learn" class="mode-btn active">learn</button>
          <button id="btn-mode-test" class="mode-btn">test</button>
        </div>

        <!-- Learn Mode View -->
        <div id="view-learn" class="view-content active">
          <div id="verbs-list" class="verbs-list">
            <!-- Dynamic list of verbs will go here -->
          </div>
        </div>

        <!-- Test Mode View -->
        <div id="view-test" class="view-content">
          <div class="test-card-container">
            <div id="test-card" class="test-card">
              <div class="card-inner">
                <div class="card-front">
                  <span class="card-label">English</span>
                  <h2 id="test-english" class="verb-meaning">to be able to</h2>
                  <span class="tap-hint">Tap to reveal</span>
                </div>
                <div class="card-back">
                  <span id="test-card-label" class="card-label">Russian</span>
                  <h2 id="test-russian" class="verb-cyrillic">мочь</h2>
                  <div class="pronunciation-badge">
                    <span id="test-pronunciation">[much]</span>
                  </div>
                  <div id="test-example-container" class="example-container">
                    <span class="card-label">Example</span>
                    <p id="test-example" class="verb-example">я хочу говорить по-русски</p>
                  </div>
                </div>
              </div>
            </div>
            <button id="btn-next-test" class="action-btn next-btn">Next Verb</button>
          </div>
        </div>
      </section>

      <!-- Numbers Page -->
      <section id="page-numbers" class="page-section">
        <div class="mode-selector">
          <button id="btn-num-mode-learn" class="mode-btn active">learn</button>
          <button id="btn-num-mode-test" class="mode-btn">test</button>
        </div>

        <!-- Learn Mode View -->
        <div id="view-num-learn" class="view-content active">
          <a href="https://www.youtube.com/watch?v=aeXpCLtrVuo" target="_blank" class="video-link-card">
            <span class="video-icon">🎥</span>
            <div class="video-info">
              <span class="video-tag">YouTube Video</span>
              <span class="video-title">Russian Numbers 1-100 Pronunciation</span>
              <span class="video-subtitle">Tap to watch the full pronunciation guide on YouTube</span>
            </div>
          </a>
          <div id="numbers-list" class="verbs-list">
            <!-- Dynamic list of numbers will go here -->
          </div>
        </div>

        <!-- Test Mode View -->
        <div id="view-num-test" class="view-content">
          <div class="test-card-container">
            <div id="num-test-card" class="test-card">
              <div class="card-inner">
                <div class="card-front">
                  <span class="card-label">Number</span>
                  <h2 id="test-num-digit" class="verb-meaning" style="font-size: 3.5rem;">42</h2>
                  <span class="tap-hint">Tap to reveal</span>
                </div>
                <div class="card-back">
                  <span id="test-num-card-label" class="card-label">Number #42</span>
                  <h2 id="test-num-spelled" class="verb-cyrillic" style="font-size: 1.8rem; margin: 10px 0;">сорок два</h2>
                  <div class="pronunciation-badge" style="background-color: transparent; border: none;">
                    <a id="test-num-listen-link" href="#" target="_blank" class="listen-link" style="color: var(--accent-color); text-decoration: none; font-size: 0.95rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                      🔊 Listen on Google Translate
                    </a>
                  </div>
                </div>
              </div>
            </div>
            <button id="btn-next-num-test" class="action-btn next-btn">Next Number</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
